name: NewsBot 2.0 automated quality checks
on:
  push:
    paths: ['newsbot2/**','tests/**','data/**','app.py','requirements-*.txt','.github/workflows/newsbot2-tests.yml']
  pull_request:
  workflow_dispatch:
jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests -q
      - run: python -m newsbot2.cli overview > /tmp/newsbot2-overview.json
      - run: python -m newsbot2.cli evaluate > /tmp/newsbot2-eval.json
      - uses: actions/upload-artifact@v4
        with:
          name: newsbot2-smoke-and-evaluation
          path: |
            /tmp/newsbot2-overview.json
            /tmp/newsbot2-eval.json
