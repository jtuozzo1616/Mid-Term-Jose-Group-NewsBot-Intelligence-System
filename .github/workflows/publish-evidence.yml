name: Publish Verified NewsBot Evidence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-evidence.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: newsbot-results-publication
  cancel-in-progress: false

jobs:
  publish-verified:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download verified completed BBC run
        uses: actions/download-artifact@v4
        with:
          name: NewsBot-real-BBC-execution-evidence
          run-id: 38488603289
          github-token: ${{ github.token }}
      - name: Unpack real-data evidence
        run: unzip -oq NewsBot_VERIFIED_EXECUTION_EVIDENCE.zip
      - name: Refuse synthetic or incomplete data
        run: |
          python3 - <<'PY'
          import json, pathlib
          d=pathlib.Path('outputs')
          m=json.loads((d/'run_manifest.json').read_text())
          assert m['notebook_execution_status']=='REAL_DATA_EXECUTED'
          assert m['dataset_origin'] in ('user_supplied_Kaggle_CSV','public_research_mirror_of_Kaggle_competition_CSV')
          assert m['rows']==1440
          assert len(m['source_file_sha256'])==64
          assert 0 <= m['holdout_macro_f1'] <= 1
          assert len(list(d.glob('*.png'))) >= 8
          assert (d/'newsbot_classifier.joblib').is_file()
          assert (pathlib.Path('docs')/'NewsBot_Reflection_Solo.pdf').is_file()
          print('Verified historical BBC records:',m['rows'],'macro-F1:',m['holdout_macro_f1'])
          PY
      - name: Commit allowed aggregates, figures, trained model and PDF reports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f outputs/*.png outputs/model_cv_comparison.csv outputs/per_class_metrics.csv outputs/feature_ablation.csv outputs/robustness_stress_test.csv outputs/bootstrap_uncertainty.json outputs/holdout_metrics.json outputs/run_manifest.json outputs/insights.json outputs/classification_report.txt outputs/EVIDENCE_BASED_FINDINGS.txt outputs/newsbot_classifier.joblib
          git add docs/MT_Report_Group_Solo_Jose_Miguel_Tuozzo_Izaguirre_ITAI2373.pdf docs/NewsBot_Reflection_Solo.pdf
          if ! git diff --cached --quiet; then
            git commit -m 'docs: publish real BBC results and report [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo 'No new evidence to commit'
          fi
