name: Verified BBC Evaluation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/newsbot-verify.yml"
      - "Midterm_NewsBot_Intelligence_System.ipynb"
      - "run_all_and_package.py"
      - "verify_release.py"
      - "reflection.py"
      - "generate_final_report.py"
      - "requirements.txt"
      - "tests/**"
      - "verify_error_audit.py"
      - "outputs/error_directions.csv"

concurrency:
  group: newsbot-bbc-evaluation
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  real-bbc-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies and NLP resources
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m spacy download en_core_web_sm
          python -m nltk.downloader vader_lexicon
          python -m ipykernel install --user --name python3 --display-name "Python 3 (NewsBot)"
      - name: Unit tests on synthetic software fixtures (NOT BBC metrics)
        run: python -m unittest discover -s tests -v
      - name: Execute complete notebook on historical BBC data
        run: python -u run_all_and_package.py --github https://github.com/jtuozzo1616/Mid-Term-Jose-Group-NewsBot-Intelligence-System --timeout 1800
      - name: Verify required real outputs before publication
        run: python verify_release.py
      - name: Verify all 11 holdout error directions against per-class metrics
        run: python verify_error_audit.py
      - name: Publish aggregate evidence to the public repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f outputs/*.png outputs/model_cv_comparison.csv outputs/per_class_metrics.csv outputs/feature_ablation.csv outputs/robustness_stress_test.csv outputs/bootstrap_uncertainty.json outputs/holdout_metrics.json outputs/run_manifest.json outputs/insights.json outputs/classification_report.txt outputs/EVIDENCE_BASED_FINDINGS.txt
          git add docs/MT_Report_Group_Solo_Jose_Miguel_Tuozzo_Izaguirre_ITAI2373.pdf docs/NewsBot_Reflection_Solo.pdf
          if ! git diff --cached --quiet; then
            git commit -m "docs: publish verified BBC evaluation figures and empirical reports [skip ci]"
            # The training run may last several minutes; main can move meanwhile.
            # Rebase *only* the new evidence commit onto the latest remote main.
            # Generated cells also touch tracked local files not included in the evidence commit.
            # Safely discard those *unstaged* runner-only changes before rebasing.
            git status --short
            git restore --worktree .
            git fetch origin main
            git rebase -X theirs origin/main
            git push origin HEAD:main
          else
            echo "No changed empirical artifacts"
          fi
      - name: Keep evidence ZIP and executed notebook downloadable
        uses: actions/upload-artifact@v4
        with:
          name: NewsBot-real-BBC-execution-evidence
          path: |
            NewsBot_VERIFIED_EXECUTION_EVIDENCE.zip
            Midterm_NewsBot_Intelligence_System_EXECUTED.ipynb
          if-no-files-found: error
          retention-days: 30
